name: Publish new version

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  generate-release-archive:
    name: Generate release archive
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: use

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout USE
        uses: actions/checkout@v4
        with:
          path: use
          fetch-depth: 0

      - name: Checkout JaCaMo
        uses: actions/checkout@v4
        with:
          repository: nguyentrungnghia1802/jacamo
          ref: main
          path: jacamo
          persist-credentials: false

      - name: Preserve legacy fixture path casing
        shell: pwsh
        working-directory: .
        run: |
          if (-not (Test-Path -LiteralPath JaCaMo)) {
            New-Item -ItemType Junction -Path JaCaMo -Target jacamo
          }

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: use/**/pom.xml

      - name: Install pinned checkpoint runtime artifacts
        run: python install-checkpoint-artifacts.py

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "use/use-assembly/target/*.zip"
          generateReleaseNotes: true

      - name: Create "Bump Version" Issue
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_USE_VERSION: ${{ github.ref_name }}
        with:
          filename: use/.github/ISSUE_TEMPLATE/version_update.md
